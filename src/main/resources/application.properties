# ===================================================================
# APPLICATION / SPRING BOOT CONFIGURATION
# ===================================================================
spring.application.name=IronSync
server.port=${SERVER_PORT}

# ===================================================================
# DATABASE CONNECTION (MariaDB)
# Note: Pointing to local port 3307 which maps to container port 3306
# ===================================================================
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
# MariaDB specific dialect
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ddl-auto options:
#   - update: automatically creates/updates tables without deleting existing data
#   - create-drop: recreates the DB on startup and drops it on shutdown
#   - validate: validates that entities match the existing database schema
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Exposed health endpoint test
management.endpoints.web.exposure.include=health
